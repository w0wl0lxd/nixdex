# Configuration for `cargo audit`, run by .github/workflows/secrets-scan.yml
# as `cargo audit --deny warnings`.

[advisories]
# Every entry here must name the crate, why the advisory does not apply to this
# workspace, and what would let us remove the entry again. Nothing is ignored
# because it is inconvenient.
ignore = [
  # paste 1.0.15 -- unmaintained. Reached only through `ratatui`, which still
  # depends on it for its macro helpers. It is a proc-macro used at build time
  # with no runtime surface. Remove once ratatui drops the dependency.
  "RUSTSEC-2024-0436",

  # lru 0.12.5 -- unsound: `LruCache::pop()` is not panic-safe, which can leave
  # a use-after-free. Reached only through `ratatui`, which pins `lru = "^0.12"`
  # while the fix landed in a later major version, so no reachable release
  # resolves it. No nixdex code calls `lru` directly. Remove once ratatui
  # depends on a fixed major version.
  "RUSTSEC-2026-0253",
  "RUSTSEC-2026-0002",
]
